name: Build Android APK

# push 代码或手动点击 Run workflow 时，自动编译 APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK（含 platform 34 / build-tools），
      # 不再用 android-actions/setup-android（该 action 常因下载 cmdline-tools 失败）
      - name: 确认 Android SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "::error::未检测到 Android SDK 环境变量"
            exit 1
          fi
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK_DIR/platforms" || true
          if [ ! -d "$SDK_DIR/platforms/android-34" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "安装 android-34 ..."
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          fi
          if [ ! -d "$SDK_DIR/build-tools/34.0.0" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "安装 build-tools 34.0.0 ..."
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          fi

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 到 Actions 成品
        uses: actions/upload-artifact@v4
        with:
          name: 70mai-video-grabber-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
