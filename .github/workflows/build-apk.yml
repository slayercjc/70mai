name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 确认 Android SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "::error::未检测到 Android SDK 环境变量"
            exit 1
          fi
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK_DIR/platforms" || true

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        id: build
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "编译退出码: $RC"
          if [ "$RC" -ne 0 ]; then
            echo "=== 编译失败，错误摘要（前 120 行）===" >> "$GITHUB_STEP_SUMMARY"
            head -120 build.log >> "$GITHUB_STEP_SUMMARY"
            echo "```" >> "$GITHUB_STEP_SUMMARY"
            echo "BUILD FAILED - see build.log artifact" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$RC"

      - name: 上传编译日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 70mai-video-grabber-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
